# ==============================================================================
# ontap-sim-2node-proxmox.conf
# Configuration file for ontap-sim-2node-proxmox.sh
#
# This file contains all customizable settings for ONTAP Simulator deployment.
# Copy this file and modify as needed, then pass to the script:
#   ./ontap-sim-2node-proxmox.sh --config my-config.conf
# or set CONFIG_FILE environment variable:
#   CONFIG_FILE=my-config.conf ./ontap-sim-2node-proxmox.sh
# ==============================================================================

# ---------- Storage Configuration ----------
# Proxmox storage-id for VM disks
VM_STORAGE="datastore_ds02"

# Proxmox storage-id where the OVA is located
OVA_STORAGE_ID="software"

# Full path to the directory containing the OVA
OVA_DIR="/mnt/pve/${OVA_STORAGE_ID}/template/iso"

# Filename of the OVA
OVA_NAME="vsim-netapp-DOT9.16.1-cm_nodar.ova"

# ---------- Cluster Naming ----------
# Prefix for VM names (schema: {prefix}-cluster{NN}-{01|02})
# Example: sim-cluster01-01, sim-cluster01-02
CLUSTER_PREFIX="lab"

# Cluster number: auto (first free number) or explicit (e.g., 01, 02, 03)
CLUSTER_NUM="auto"

# ---------- Node and VMID Assignment ----------
# Proxmox node for node1 of the cluster
TARGET_NODE1="pve02"

# Proxmox node for node2 of the cluster
TARGET_NODE2="pve04"

# VMID for node1 (auto = cluster-wide free ID)
VMID1="106"

# VMID for node2 (auto = first free ID after VMID1)
VMID2="107"

# ---------- Network Configuration ----------
# Cluster interconnect (net0, net1) — apart L2-domein, verplicht gescheiden van data
CLUSTER_BRIDGE="vmbr1"

# VLAN tag voor cluster interconnect (0 = geen tag). VERPLICHT, geen default.
# Het script stopt als dit leeg is, of als cluster en data dezelfde bridge + tag hebben.
CLUSTER_VLAN_TAG=""   # invullen volgens StoreLinq netwerk-VLAN-plan

# Dataverkeer (NFS, iSCSI)
DATA_BRIDGE="vmbr1"

# VLAN tag voor data (0 = geen tag)
DATA_VLAN_TAG="53"

# CIFS-poorten: optionele override. Default = DATA_BRIDGE / DATA_VLAN_TAG.
#CIFS_BRIDGE="vmbr0"
#CIFS_VLAN_TAG="0"

# Aantal netwerk poorten per VM
# Formule: 2 (cluster) + 3*N (data)  →  (NUM_NET_PORTS - 2) % 3 == 0
#
# Toewijzing per poort:
#   net0, net1          : cluster interconnect  (altijd)
#   volgende N poorten  : cifs  — ONTAP ifgroup a0a
#   volgende N poorten  : nfs   — ONTAP ifgroup a0b
#   laatste N poorten   : iscsi — individuele poorten (geen ifgroup)
#
# Geldige waarden: 5 (1+1+1), 8 (2+2+2), 11 (3+3+3), 14 (4+4+4), ...
NUM_NET_PORTS="8"

# ---------- VM Hardware Configuration ----------
# Number of CPU cores per VM
CORES="2"

# Number of sockets per VM
SOCKETS="1"

# RAM per VM in MB
MEMORY_MB="8192"

# QEMU CPU type (e.g., SandyBridge, Haswell, EPYC)
CPU_TYPE="SandyBridge"

# Network model (e.g., e1000, virtio)
NET_MODEL="e1000"

# ---------- Disk Configuration ----------
# Disk format for import (raw or qcow2)
DISK_FORMAT="raw"

# ---------- Simulated disks (optional) ----------
# Bigger simulated ONTAP disks than the OVA default (28 x 1 GB). Leave
# SIM_DISK_TYPE empty/unset = behaviour unchanged. Set it, and the script writes
#   setenv bootarg.vm.sim.vdevinit "<type>:<disks>:<shelf>,..."
#   setenv bootarg.sim.vdevinit    "<type>:<disks>:<shelf>,..."
# into /env/env of BOTH nodes (same guestfish inject as the serials, so it needs
# AUTOMATE_NODE2_SYSID=1), i.e. before the first boot. One entry per shelf,
# shelves numbered from 0. Example: SIM_DISK_TYPE=36, 14 disks, 2 shelves:
#   "36:14:0,36:14:1"
#
# Valid disk types (nominal size per disk). COMMUNITY-SOURCED, not from official
# NetApp documentation: confirm with `vsim_makedisks -h` on your simulator.
#   23  ~1 GB   OVA default
#   31  ~4 GB
#   36  ~9 GB   largest type that the sources agree on
# Other types (e.g. 35, 37) are only accepted together with SIM_DISK_SIZE_GB.
#
# The simulated disks are files on the 4th OVA disk (ide3, the "sim disk"). The
# script reads the size of that disk before importing and stops with the maximum
# number of disks if the layout does not fit. It does NOT resize the disk (see README).
# Hard limits: max 14 disks per shelf, max 4 shelves (56 disks in total).
SIM_DISK_TYPE=""
#SIM_DISKS_PER_SHELF="14"     # 1-14, default 14 when SIM_DISK_TYPE is set
#SIM_SHELVES="2"              # 1-4,  default 2  when SIM_DISK_TYPE is set
#SIM_DISK_SIZE_GB=""          # nominal GB per disk; only needed for types not listed above
#SIM_DISK_MARGIN_PCT="10"     # extra room on the sim disk on top of disks x size

# ---------- Operation Modes ----------
# Start VMs immediately after creation (1=yes, 0=no)
START_AFTER_CREATE="0"

# Inject unique SYS_SERIAL_NUM and SYSID via guestfish (1=yes, 0=no)
AUTOMATE_NODE2_SYSID="1"

# ---------- ONTAP Simulator Serial Numbers ----------
# Fixed license serials for ONTAP Simulator
# Node1 serial numbers
NODE1_SYS_SERIAL_NUM="4082368-50-7"
NODE1_SYSID="4082368507"

# Node2 serial numbers (unique per node)
NODE2_SYS_SERIAL_NUM="4034389-06-2"
NODE2_SYSID="4034389062"

# ---------- Script Runtime Configuration ----------
# Working directory for temporary files (the OVA is extracted below it, in
# extracted-<node> directories, on every host that runs a node). Needs about the
# extracted size of the OVA + 10% free per host; the script checks this before it
# extracts anything and stops with host/path/needed/free if there is not enough.
WORKDIR="/var/tmp/ontap-sim-9.16.1"

# Remove the extracted OVA directories (WORKDIR/extracted-<node>) after BOTH nodes
# were imported successfully?  0 = remove (default), 1 = keep.
# After an error they are never removed, so there is something to debug.
# Only paths below WORKDIR are ever removed.
KEEP_EXTRACTED="0"

# Timeout in seconds for serial console operations
EXPECT_TIMEOUT="360"

# SSH options for remote execution
SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=5"
